name: pr

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: env-hopper
          POSTGRES_PASSWORD: env-hopper
          POSTGRES_DB: env-hopper
        ports: ['5532:5432']
        options: >-
          --health-cmd "pg_isready -U env-hopper" --health-interval 5s --health-retries 10
    env:
      # secretlint-disable
      EH_CORE_TEST_DATABASE_URL: postgres://env-hopper:env-hopper@localhost:5532/env-hopper?schema=eh_core_test
      # secretlint-enable
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Tools
        uses: tanstack/config/.github/setup@main
      - name: Get base and head commits for `nx affected`
        uses: nrwl/nx-set-shas@v4.1.2
        with:
          main-branch-name: main
      - name: Self-check the release script
        run: bash scripts/release-main.test.sh
      - name: Check declared versions against the registry
        run: node scripts/check-registry-versions.mjs
      - name: Run Checks
        run: pnpm run test:pr --parallel=3
  preview:
    name: Preview
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Tools
        uses: tanstack/config/.github/setup@main
      - name: Build Packages
        run: pnpm run build:all
      - name: Publish Previews
        run: pnpx pkg-pr-new publish --pnpm --compact './packages/*' --template './examples/*/*'
      - name: Determine commit SHA
        id: determine-sha
        run: |
          echo "COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> $GITHUB_ENV
